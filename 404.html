<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex">
<script>
/* Appka webowa (Expo) to jedna strona: GitHub Pages nie zna jej tras, więc /lot/abc odsyłamy do
   bazy appki z ?sciezka=/lot/abc, a appka przywraca adres (sciezkaSpa.web.ts).
   Baza: "/zlecenie/" (appka pod /zlecenie) albo "/" (appka pod adresem głównym, DW20; workflow „Web” podmienia).
   Przy bazie "/" stare adresy /zlecenie/... prowadzą do tych samych ekranów bez /zlecenie.
   Bez pętli: sama baza i adresy z ?sciezka= zostają na tej stronie 404. */
(function () {
  var baza = "/";
  var p = location.pathname;
  if (location.search.indexOf("sciezka=") !== -1) return;
  if (baza === "/" && p.indexOf("/zlecenie") === 0) p = p.slice("/zlecenie".length) || "/";
  if (p.indexOf(baza) !== 0) return;
  if (p === baza || p === baza + "index.html") {
    if (p !== location.pathname) location.replace(baza + location.search + location.hash);
    return;
  }
  var reszta = "/" + p.slice(baza.length) + location.search;
  location.replace(baza + "?sciezka=" + encodeURIComponent(reszta) + location.hash);
})();
</script>
<title>Gołąb zabłądził | Gołębie Latają</title>

:root{--paper:#F7F1E4;--ink:#2A2C31;--ink-soft:#5E626A;--red:#D0402A;--navy:#1F3B6E;--white:#FFFDF8}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light only;background:var(--paper)}
body{font-family:Nunito,system-ui,sans-serif;font-weight:500;font-size:18px;line-height:1.6;color:var(--ink);background:var(--paper);min-height:100vh;display:flex;flex-direction:column}
.strip{height:8px;flex-shrink:0;background:repeating-linear-gradient(135deg,var(--red) 0 14px,var(--white) 14px 22px,var(--navy) 22px 36px,var(--white) 36px 44px)}
main{flex:1;display:grid;place-items:center;padding:48px 20px;text-align:center}
.box{max-width:520px}
.stempel{display:inline-grid;place-items:center;align-content:center;width:150px;height:150px;border-radius:50%;border:5px double var(--red);color:var(--red);transform:rotate(-9deg);margin:0 auto 28px;line-height:1.05}
.stempel b{display:block;font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:2.6rem}
.stempel span{display:block;font-family:"IBM Plex Mono",monospace;font-size:.72rem}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;color:var(--navy);font-size:clamp(2.1rem,6vw,3rem);line-height:1.08;margin-bottom:14px}
p{margin-bottom:26px}
.back{display:inline-block;font-weight:800;background:var(--red);color:var(--white);text-decoration:none;border-radius:16px;padding:12px 24px;min-height:48px}
.back:hover{background:#B8361F}
.back:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
</style>
</head>
<body>
<div class="strip" aria-hidden="true"></div>
<main>
  <div class="box">
    <div class="stempel" role="img" aria-label="Błąd 404, adresat nieznany"><span>zwrot do nadawcy</span><b>404</b><span>adresat nieznany</span></div>
    <h1>Gołąb zabłądził</h1>
    <p>Strona, której szukasz, nie istnieje albo zmieniła adres. Lot trwa dalej, a plan czeka pod właściwym adresem.</p>
    <a class="back" href="/">Wróć na stronę główną</a>
  </div>
</main>
<div class="strip" aria-hidden="true"></div>
</body>
