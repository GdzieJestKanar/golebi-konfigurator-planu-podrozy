<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex">
<script>
/* Appka webowa (Expo) to jedna strona: GitHub Pages nie zna jej tras, więc /lot/abc odsyłamy do
   bazy appki z ?sciezka=/lot/abc, a appka przywraca adres (sciezkaSpa.web.ts).
   Baza: "/zlecenie/" (appka pod /zlecenie) albo "/" (appka pod adresem głównym, DW20; workflow „Web” podmienia).
   Przy bazie "/" stare adresy /zlecenie/... prowadzą do tych samych ekranów bez /zlecenie.
   Bez pętli: sama baza i adresy z ?sciezka= zostają na tej stronie 404. */
(function () {
  var baza = "/";
  var p = location.pathname;
  if (location.search.indexOf("sciezka=") !== -1) return;
  if (baza === "/" && p.indexOf("/zlecenie") === 0) p = p.slice("/zlecenie".length) || "/";
  if (p.indexOf(baza) !== 0) return;
  /* Audyt 15.11.2026: przy bazie "/" do appki odsyłamy tylko adresy jej ekranów (pierwszy człon adresu z listy poniżej).
     Literówka w adresie przewodnika zostaje na tej lekkiej stronie z wyszukiwarką kierunków, zamiast ładować całą appkę
     po to, żeby pokazać 404. Lista to nazwy z apps/mobile/src/app; test w apps/mobile pilnuje zgodności. */
  var EKRANY = ["biurko", "dev", "dokadkolwiek", "dolacz", "jak-sortujemy", "kierunki", "konto", "lot", "nowy", "o-nas", "obserwowane", "odkrywaj", "okazje", "p", "podroze", "podroznik", "premium", "prezent", "profil", "punkty", "rodzina", "spolecznosc", "start", "szkic", "wolne-dni", "wspolne", "zaloguj", "zapytaj"];
  if (baza === "/" && EKRANY.indexOf(p.split("/")[1]) === -1) return;
  if (p === baza || p === baza + "index.html") {
    if (p !== location.pathname) location.replace(baza + location.search + location.hash);
    return;
  }
  var reszta = "/" + p.slice(baza.length) + location.search;
  /* D9: przy bazie "/" pod adresem głównym jest statyczna strona główna, a appka startuje z /start. */
  var cel = baza === "/" ? "/start" : baza;
  location.replace(cel + "?sciezka=" + encodeURIComponent(reszta) + location.hash);
})();
</script>
<title>Gołąb zabłądził | Gołębie Latają</title>

<style>
@font-face{font-family:"Young Serif";font-weight:400;font-display:swap;src:url(/fonty/young-serif-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Young Serif";font-weight:400;font-display:swap;src:url(/fonty/young-serif-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1E9F}
@font-face{font-family:"Nunito";font-weight:200 1000;font-display:swap;src:url(/fonty/nunito-latin-wght-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Nunito";font-weight:200 1000;font-display:swap;src:url(/fonty/nunito-latin-ext-wght-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+1E00-1E9F}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/fonty/ibm-plex-mono-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/fonty/ibm-plex-mono-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1E9F}
:root{--paper:#F7F1E4;--ink:#2A2C31;--ink-soft:#5E626A;--red:#D0402A;--navy:#1F3B6E;--white:#FFFDF8}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light only;background:var(--paper)}
body{font-family:Nunito,system-ui,sans-serif;font-weight:500;font-size:18px;line-height:1.6;color:var(--ink);background:var(--paper);min-height:100vh;display:flex;flex-direction:column}
.strip{height:8px;flex-shrink:0;background:repeating-linear-gradient(135deg,var(--red) 0 14px,var(--white) 14px 22px,var(--navy) 22px 36px,var(--white) 36px 44px)}
main{flex:1;display:grid;place-items:center;padding:48px 20px;text-align:center}
.box{max-width:520px}
.stempel{display:inline-grid;place-items:center;align-content:center;width:150px;height:150px;border-radius:50%;border:5px double var(--red);color:var(--red);transform:rotate(-9deg);margin:0 auto 28px;line-height:1.05}
.stempel b{display:block;font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:2.6rem}
.stempel span{display:block;font-family:"IBM Plex Mono",monospace;font-size:.72rem}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;color:var(--navy);font-size:clamp(2.1rem,6vw,3rem);line-height:1.08;margin-bottom:14px}
p{margin-bottom:22px}
form{margin:0 auto 22px;max-width:420px;text-align:left}
label{display:block;font-weight:800;font-size:.95rem;margin-bottom:6px}
.pole{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--white);border:1.5px solid var(--navy);border-radius:14px;padding:10px 14px;min-height:48px}
button{font:inherit;font-weight:800;color:var(--white);background:var(--red);border:0;border-radius:14px;padding:10px 20px;min-height:48px;cursor:pointer}
button:hover{background:#B8361F}
input:focus-visible,button:focus-visible,.linki a:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.linki{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;margin-bottom:0}
.linki a{color:var(--navy);font-weight:800}
.back{display:inline-block;font-weight:800;background:var(--red);color:var(--white);text-decoration:none;border-radius:16px;padding:12px 24px;min-height:48px}
.back:hover{background:#B8361F}
.back:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
</style>
</head>
<body>
<div class="strip" aria-hidden="true"></div>
<main>
  <div class="box">
    <div class="stempel" role="img" aria-label="Błąd 404, adresat nieznany"><span>zwrot do nadawcy</span><b>404</b><span>adresat nieznany</span></div>
    <h1>Gołąb zabłądził</h1>
    <p>Strona, której szukasz, nie istnieje albo zmieniła adres. Wpisz kierunek, a znajdziemy właściwą stronę.</p>
    <form role="search" action="/kierunki/">
      <label for="q">Dokąd chcesz lecieć?</label>
      <div class="pole"><input id="q" name="q" type="search" placeholder="np. Majorka, Grecja, Rzym" autocomplete="off" enterkeyhint="search"><button type="submit">Szukaj</button></div>
    </form>
    <p class="linki"><a href="/">Strona główna</a><a href="/kierunki/">Wszystkie kierunki</a><a href="/okazje/">Okazje</a></p>
  </div>
</main>
<div class="strip" aria-hidden="true"></div>
<script>
/* Podpowiedź z błędnego adresu: /kierunki-majorka albo /majorka/ wpisuje „majorka” w pole szukania. */
(function () {
  var q = document.getElementById("q");
  if (!q || q.value) return;
  var czesci = location.pathname.split("/").filter(Boolean);
  var ostatni = czesci[czesci.length - 1] || "";
  try { ostatni = decodeURIComponent(ostatni); } catch (e) {}
  var s = ostatni.replace(/\.html?$/, "").replace(/^(kierunki|kierunek|kraje|kraj)-/, "").replace(/[-_]+/g, " ").trim();
  /* Tylko jedno albo dwa słowa: dłuższy adres to tytuł tekstu, nie nazwa kierunku. */
  if (location.search.indexOf("sciezka=") === -1 && /^[a-zA-Z\u00C0-\u017F]{3,20}( [a-zA-Z\u00C0-\u017F]{2,20})?$/.test(s)) q.value = s;
})();
</script>
</body>
</html>
