<script>
(function () {
  var start = document.getElementById('gl-start'), root = document.getElementById('root');
  if (!start || !root) return;
  var awaryjnie = null;
  function sprawdz(wymus) {
    if (!wymus && root.textContent.replace(/\s+/g, '').length < 12) {
      // Ekran appki prawie bez tekstu (np. sam obraz): nie zasłaniamy go dłużej niż 2,5 s od pierwszego rysowania.
      if (root.firstElementChild && !awaryjnie) awaryjnie = setTimeout(function () { sprawdz(true); }, 2500);
      return false;
    }
    if (start.parentNode) start.parentNode.removeChild(start);
    var styl = document.getElementById('gl-start-styl');
    if (styl && styl.parentNode) styl.parentNode.removeChild(styl);
    return true;
  }
  if (sprawdz()) return;
  var obserwator = window.MutationObserver ? new MutationObserver(function () { if (sprawdz()) obserwator.disconnect(); }) : null;
  if (obserwator) obserwator.observe(root, { childList: true, subtree: true, characterData: true });
  else var odpytywanie = setInterval(function () { if (sprawdz()) clearInterval(odpytywanie); }, 200);
  setTimeout(function () { var d = start.querySelector('.gl-dlugo'); if (d && start.parentNode) d.hidden = false; }, 15000);
})();
</script>
